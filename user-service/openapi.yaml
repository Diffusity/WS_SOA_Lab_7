openapi: 3.0.3
info:
  title: Student Management REST API
  description: >
    RESTful Web Service for managing students - Web Services & SOA Laboratory, Labs 3-4.
    The API contract from Lab 3 is unchanged; storage has moved from an in-memory array
    to MongoDB Atlas (Mongoose). CORS is enabled so browser clients can consume it.
  version: 2.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: Students
    description: CRUD operations on the Student resource
paths:
  /students:
    get:
      tags: [Students]
      summary: List all students
      operationId: listStudents
      responses:
        "200":
          description: List of all students (sorted by creation order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Students]
      summary: Create a new student
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
            example:
              name: Aarav Patel
              email: aarav@example.com
              course: Computer Science
              semester: 5
      responses:
        "201":
          description: Student created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid or incomplete request body, or duplicate email (unique index)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /students/{id}:
    parameters:
      - $ref: "#/components/parameters/StudentId"
    get:
      tags: [Students]
      summary: Get one student by id
      operationId: getStudentById
      responses:
        "200":
          description: Student found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: id path parameter is not a valid MongoDB ObjectId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested student id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Students]
      summary: Update an existing student (partial body allowed)
      operationId: updateStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
            example:
              course: Data Science
              semester: 6
      responses:
        "200":
          description: Student updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid request body/path parameter or duplicate email (unique index)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested student id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Students]
      summary: Partially update an existing student
      operationId: patchStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Student updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid request body/path parameter or duplicate email (unique index)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested student id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Students]
      summary: Delete a student by id
      operationId: deleteStudent
      responses:
        "204":
          description: Student deleted successfully (no content)
        "400":
          description: id path parameter is not a valid MongoDB ObjectId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested student id does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    StudentId:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the student (24-character hex string)
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
        example: 66f1a2b3c4d5e6f708192a3b
  schemas:
    StudentInput:
      type: object
      required: [name, email, course, semester]
      properties:
        name:
          type: string
          maxLength: 100
          example: Aarav Patel
        email:
          type: string
          format: email
          example: aarav@example.com
        course:
          type: string
          example: Computer Science
        semester:
          type: integer
          minimum: 1
          maximum: 12
          example: 5
    StudentUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
          example: Aarav Patel
        email:
          type: string
          format: email
          example: aarav@example.com
        course:
          type: string
          example: Computer Science
        semester:
          type: integer
          minimum: 1
          maximum: 12
          example: 5
    Student:
      type: object
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f1a2b3c4d5e6f708192a3b
          description: MongoDB ObjectId hex string
        name:
          type: string
          example: Aarav Patel
        email:
          type: string
          format: email
          example: aarav@example.com
        course:
          type: string
          example: Computer Science
        semester:
          type: integer
          example: 5
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: string
          example:
            - "name is required and must be a non-empty string"
            - "email must be a valid email address"
            - "semester must be between 1 and 12"
  responses:
    InternalServerError:
      description: Unexpected server-side failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
